<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
<title>My Salary Tracker</title>
</head>
<body>
<div class="app">
<header class="top">
<div><div id="weekday" class="muted"></div><div id="date" class="date"></div></div>
<div class="clock" id="clock">--:--</div>
<button class="icon-btn" id="menuBtn" aria-label="Menu">☰</button>
</header>
<main id="view">
<section class="welcome"><p class="eyebrow" data-i18n="overview">OVERVIEW</p><h1 data-i18n="hello">Hello 👋</h1><p class="muted" data-i18n="subtitle">Your personal finance dashboard</p></section>
<section class="card balance"><div class="muted" data-i18n="outstanding">Outstanding salary</div><div class="amount">€0.00</div><div class="small" data-i18n="localNote">Your data stays on this device</div></section>
<section class="grid">
<div class="stat card"><span data-i18n="earned">Earned</span><strong>€0.00</strong></div>
<div class="stat card"><span data-i18n="received">Received</span><strong>€0.00</strong></div>
<div class="stat card"><span data-i18n="expenses">Expenses</span><strong>€0.00</strong></div>
<div class="stat card"><span data-i18n="remittance">Remittance</span><strong>€0.00</strong></div>
</section>
<h2 data-i18n="quickActions">Quick actions</h2>
<section class="actions">
<button class="action" data-action="duty"><span>🗓️</span><label data-i18n="basicDuty">Basic Duty</label></button>
<button class="action" data-action="ot"><span>⏱️</span><label data-i18n="overtime">Overtime</label></button>
<button class="action" data-action="expense"><span>🧾</span><label data-i18n="addExpense">Expense</label></button>
<button class="action" data-action="salary"><span>💶</span><label data-i18n="salaryReceived">Salary Received</label></button>
<button class="action" data-action="send"><span>🇧🇩</span><label data-i18n="remitMoney">Remittance</label></button>
<button class="action" data-action="gift"><span>🎁</span><label data-i18n="moneyGiven">Money Given</label></button>
</section>
<section class="card placeholder"><h3 data-i18n="comingSoon">Modules will be added step by step</h3><p class="muted" data-i18n="checklistMsg">We will build each feature and check it off our Master Checklist.</p></section>
</main>
<nav class="nav">
<button class="nav-item active" data-tab="home"><span>⌂</span><small data-i18n="home">Home</small></button>
<button class="nav-item" data-tab="work"><span>🗓</span><small data-i18n="work">Work</small></button>
<button class="nav-item plus" id="plusBtn">＋</button>
<button class="nav-item" data-tab="money"><span>€</span><small data-i18n="money">Money</small></button>
<button class="nav-item" data-tab="reports"><span>▥</span><small data-i18n="reports">Reports</small></button>
</nav>
</div>
<div class="toast" id="toast"></div>
<script src="app.js"></script>
</body>
</html>
