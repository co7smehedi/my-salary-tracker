<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101827">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
  <title>My Salary Tracker</title>
</head>
<body>
  <main class="app">
    <header class="top">
      <div><p class="eyebrow">PERSONAL FINANCE</p><h1>My Salary Tracker</h1></div>
      <button id="lang" class="pill" aria-label="Change language">EN ▾</button>
    </header>
    <section class="month"><button id="prev" aria-label="Previous month">‹</button><strong id="monthLabel"></strong><button id="next" aria-label="Next month">›</button></section>
    <section class="hero card">
      <p class="muted">Earned this month</p><div class="amount" id="earned">€0.00</div>
      <div class="stats"><div><span>Received</span><strong id="received">€0.00</strong></div><div><span>Outstanding</span><strong id="outstanding">€0.00</strong></div></div>
    </section>
    <section class="grid">
      <div class="card small"><span>Expenses</span><strong>€0.00</strong></div>
      <div class="card small"><span>Remittance</span><strong>€0.00</strong></div>
      <div class="card small"><span>Money given</span><strong>€0.00</strong></div>
    </section>
    <section class="card duty"><div><p class="muted">Today's duty</p><h2>Not recorded</h2></div><button class="primary" id="record">Record duty</button></section>
    <section class="card"><h3>Quick actions</h3><div class="actions"><button>＋ Salary received</button><button>＋ Expense</button><button>＋ Remittance</button><button>＋ Money given</button></div></section>
    <section class="card"><h3>Salary comparison</h3><p class="muted">Previous month summary will appear here.</p></section>
    <nav class="bottom"><button class="active">Home</button><button>Work</button><button class="plus">＋</button><button>Money</button><button>Reports</button></nav>
  </main>
  <script src="app.js"></script>
</body>
</html>
